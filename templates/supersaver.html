{% extends "base.html" %}

{% block title %}Supersaver - Moneybags{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2 class="mb-0"><i class="bi bi-piggy-bank me-2"></i>Supersaver</h2>
        <p class="text-muted mt-1">Track your savings for the current year</p>
    </div>
</div>

<!-- Daily Heatmap Calendar -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header supersaver-heatmap-header text-white">
                <h5 class="mb-0"><i class="bi bi-calendar-week me-2"></i><span id="calendarYearDisplay">2025</span> Savings Heatmap</h5>
            </div>
            <div class="card-body">
                <div id="calendarContainer" class="d-none">
                    <div class="heatmap-container">
                        <div id="heatmapCalendar" class="heatmap-calendar">
                            <!-- Populated by JavaScript -->
                        </div>
                        <div class="heatmap-legend-sidebar">
                            <div class="legend-title">Savings Amount</div>
                            <div class="legend-items">
                                <div class="legend-item">
                                    <span class="heatmap-legend-box heatmap-level-0"></span>
                                    <span class="legend-label">None</span>
                                </div>
                                <div class="legend-item">
                                    <span class="heatmap-legend-box heatmap-level-1"></span>
                                    <span class="legend-label">Low</span>
                                </div>
                                <div class="legend-item">
                                    <span class="heatmap-legend-box heatmap-level-2"></span>
                                    <span class="legend-label">Medium</span>
                                </div>
                                <div class="legend-item">
                                    <span class="heatmap-legend-box heatmap-level-3"></span>
                                    <span class="legend-label">High</span>
                                </div>
                                <div class="legend-item">
                                    <span class="heatmap-legend-box heatmap-level-4"></span>
                                    <span class="legend-label">Very High</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="calendarLoading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="text-muted mt-3">Loading calendar data...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Month Entries Modal -->
<div class="modal fade" id="monthEntriesModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="monthEntriesTitle">Entries</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="entriesList" class="list-group mb-3">
                    <!-- Populated by JavaScript -->
                </div>
                <div id="calendarAddEntryForm" class="d-none border-top pt-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="mb-0"><i class="bi bi-piggy-bank-fill me-2"></i><span id="calendarFormTitle">Add Entry</span></h6>
                        <button type="button" class="btn btn-link btn-sm text-muted p-0 d-none" id="calendarCancelEdit">Cancel edit</button>
                    </div>
                    <form id="calendarQuickEntryForm">
                        <div class="mb-2">
                            <label for="calendarCategory" class="form-label">Category</label>
                            <select id="calendarCategory" class="form-select form-select-sm" required>
                                <option value="">Select category...</option>
                            </select>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="calendarAmount" class="form-label">Amount</label>
                                <input type="number" id="calendarAmount" class="form-control form-control-sm" required min="0" step="1" placeholder="0">
                            </div>
                            <div class="col-6">
                                <label for="calendarComment" class="form-label">Comment</label>
                                <input type="text" id="calendarComment" class="form-control form-control-sm" placeholder="Optional">
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success btn-sm" id="calendarSubmitBtn">
                                <i class="bi bi-check-circle"></i> <span id="calendarSubmitLabel">Add</span>
                            </button>
                            <button type="button" class="btn btn-danger btn-sm d-none" id="calendarDeleteBtn">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
